services:

  # ==========================================================
  # DATABASE
  # ==========================================================

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swarm}
      POSTGRES_DB: ${POSTGRES_DB:-research_db}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================================
  # REDIS
  # ==========================================================

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================================
  # QDRANT
  # ==========================================================

  qdrant:
    image: qdrant/qdrant:v1.15.3
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:6333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==========================================================
  # BACKEND
  # ==========================================================

  backend:
    build:
      context: ./backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

    volumes:
      - ./backend:/app

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  # ==========================================================
  # CELERY WORKER
  # ==========================================================

  celery_worker:
    build:
      context: ./backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ./backend:/app

    command: >
      celery
      -A app.core.celery_app
      worker
      --loglevel=info

  # ==========================================================
  # FRONTEND (REACT SPA)
  # ==========================================================

  frontend:
    build:
      context: ./frontend

    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      - backend

    volumes:
      - ./frontend:/app

volumes:
  postgres_data:
  redis_data:
  qdrant_data: